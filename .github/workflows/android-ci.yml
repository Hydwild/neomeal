name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Проект держит секреты вне репозитория; для CI создаём заглушки,
      # чтобы сборка проходила без реальных ключей (google-services + подпись).
      - name: Prepare placeholder secrets
        run: |
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"0","project_id":"neomeal-ci"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0000000000000000","android_client_info":{"package_name":"com.nutritrack.app"}},"oauth_client":[],"api_key":[{"current_key":"ci"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      # R8 ломает рефлексию Gson незаметно для юнит-тестов и debug-сборки:
      # так в релиз уходило сломанное восстановление из бэкапа, а затем
      # шаблоны приёмов и свои рецепты. Собираем минифицированный код и
      # проверяем, что Gson сможет прочитать данные. Выгрузку mapping в
      # Crashlytics исключаем — с заглушкой google-services она упадёт.
      - name: Release R8 check (Gson)
        run: |
          ./gradlew :app:minifyReleaseWithR8 -x uploadCrashlyticsMappingFileRelease --stacktrace
          python3 scripts/check_r8_gson.py
